name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run Lint, Typecheck and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461
        with:
          bun-version: 1.2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Run Typecheck
        run: bun run typecheck

      - name: Run Unit Tests
        run: bun run test
        env:
          VITE_SUPABASE_URL: "http://localhost:54321"
          VITE_SUPABASE_KEY: "dummy-key"
